[versions]
kotlin = "2.2.21"
kotlinxSerializationJson = "1.10.0"
kotlinSerialization = "2.2.21"
kotlinxSerializationCore = "1.9.0"

# About page (root project only; the plugin is declared but never applied)
aboutLibraries = "14.0.0-b02"

# Network
ktor = "3.4.0"

# Database
rssparser = "6.1.4"

# KMP / Compose Multiplatform
composeMultiplatform = "1.9.0"
kotlinxCoroutines = "1.10.2"

# Audio
coil = "3.0.4"

# Native bindings: libmpv (core) and the Win32 user32 bindings used by the
# global media-key pump (platform).
jna = "5.14.0"

[libraries]
# Network
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Database
rssparser = { module = "com.prof18.rssparser:rssparser", version.ref = "rssparser" }

# KMP / Compose Multiplatform (shared module)
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# Native bindings
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

[plugins]
aboutLibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutLibraries" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinSerialization" }

# KMP / Compose Multiplatform
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
